name: Deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            cd /home/pd_deployer/var/www/frontend
            git fetch origin main
            git pull --ff-only origin main
            export SENTRY_RELEASE=$(git rev-parse HEAD)
            export SENTRY_AUTH_TOKEN='${{ secrets.SENTRY_AUTH_TOKEN }}'
            export SENTRY_ORG='${{ secrets.SENTRY_ORG }}'
            export SENTRY_PROJECT='${{ secrets.SENTRY_PROJECT }}'
            export SENTRY_URL='${{ secrets.SENTRY_URL }}'
            test -n "$SENTRY_AUTH_TOKEN"
            test -n "$SENTRY_ORG"
            test -n "$SENTRY_PROJECT"

            cd /home/pd_deployer/var/www
            cleanup() {
              docker compose -f laradock/docker-compose.custom.yml stop frontend-prod || true
              docker compose -f laradock/docker-compose.custom.yml rm -f frontend-prod || true
            }
            trap cleanup EXIT

            docker compose -f laradock/docker-compose.custom.yml up -d frontend-prod
            docker compose -f laradock/docker-compose.custom.yml exec -T \
              -e SENTRY_RELEASE \
              -e SENTRY_AUTH_TOKEN \
              -e SENTRY_ORG \
              -e SENTRY_PROJECT \
              -e SENTRY_URL \
              -e BUILD_OUT_DIR=build.tmp \
              -w /app frontend-prod \
              sh -c "set -e; cp package-lock.json /tmp/package-lock.expected.json; npm install --include=dev; npm prune --include=dev; cmp -s package-lock.json /tmp/package-lock.expected.json || { echo 'package-lock.json изменился: закоммитьте lockfile и повторите'; exit 1; }; rm -rf build.tmp; npm run build; find build.tmp -name '*.map' -delete; if [ -d build ]; then mv build build.bak; fi; mv build.tmp build; rm -rf build.bak dist"
